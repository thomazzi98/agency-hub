name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by deploy.yml, so a deploy can never ship code these checks did not see
  # (docs/sdd/19-deployment-and-cicd.md).
  workflow_call:

# The same shape as docker-compose.yml: PostgreSQL with an owner role that runs
# migrations and a least-privilege application role the code connects as (the API
# refuses to start as a role that can bypass RLS), and MinIO standing in for R2 with
# buckets whose names say they are disposable - the test tooling refuses any other.
env:
  DATABASE_URL: postgresql://agency_hub_app:agency-hub-app-ci@localhost:5432/agencyhub?connection_limit=10
  TEST_DATABASE_URL: postgresql://agency_hub_app:agency-hub-app-ci@localhost:5432/agencyhub_test?connection_limit=5
  E2E_DATABASE_URL: postgresql://agency_hub_app:agency-hub-app-ci@localhost:5432/agencyhub_e2e
  DB_OWNER_USER: agencyhub
  DB_OWNER_PASSWORD: agencyhub
  PASSWORD_PEPPER: ci-only-pepper-never-used-in-production
  SESSION_COOKIE_SECURE: 'false'
  STORAGE_ENDPOINT: http://localhost:9000
  STORAGE_ACCESS_KEY_ID: agencyhub
  STORAGE_SECRET_ACCESS_KEY: agencyhub-dev-secret
  STORAGE_BUCKET: agency-hub-test
  TEST_STORAGE_BUCKET: agency-hub-test
  E2E_STORAGE_BUCKET: agency-hub-e2e
  STORAGE_REGION: auto
  STORAGE_FORCE_PATH_STYLE: 'true'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyhub
          POSTGRES_PASSWORD: agencyhub
          POSTGRES_DB: agencyhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agencyhub -d agencyhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Start MinIO with the test buckets
        run: ./scripts/ci-minio.sh

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Refuses a migration that drops data without saying why, or one with no
      # down.sql (docs/sdd/19-deployment-and-cicd.md#migrations).
      - name: Review migrations
        run: node scripts/check-migrations.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyhub
          POSTGRES_PASSWORD: agencyhub
          POSTGRES_DB: agencyhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agencyhub -d agencyhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Start MinIO with the test buckets
        run: ./scripts/ci-minio.sh

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  validate-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the development compose file
        # Resolved with the documented example settings; the file requires the
        # variables a developer would have in .env.
        run: cp .env.example .env && docker compose config -q

      - name: Review the production compose file
        # Checks the resolved configuration, not the YAML text: a port added through
        # an override or an anchor is caught just the same.
        run: node scripts/check-production-compose.mjs

      - name: Build the production images
        run: |
          docker build -f apps/api/Dockerfile -t agency-hub-api:ci .
          docker build -f apps/web/Dockerfile -t agency-hub-web:ci .
