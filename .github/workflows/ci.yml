name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyhub
          POSTGRES_PASSWORD: agencyhub
          POSTGRES_DB: agencyhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agencyhub -d agencyhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://agencyhub:agencyhub@localhost:5432/agencyhub?connection_limit=10
      TEST_DATABASE_URL: postgresql://agencyhub:agencyhub@localhost:5432/agencyhub_test?connection_limit=5
      PASSWORD_PEPPER: ci-only-pepper-never-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyhub
          POSTGRES_PASSWORD: agencyhub
          POSTGRES_DB: agencyhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agencyhub -d agencyhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://agencyhub:agencyhub@localhost:5432/agencyhub?connection_limit=10
      E2E_DATABASE_URL: postgresql://agencyhub:agencyhub@localhost:5432/agencyhub_e2e
      PASSWORD_PEPPER: ci-only-pepper-never-used-in-production
      SESSION_COOKIE_SECURE: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  validate-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose configuration
        run: docker compose config
