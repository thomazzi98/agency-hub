# Production stack (docs/sdd/19-deployment-and-cicd.md).
#
# Differences from the development file that matter, each for a stated reason:
#   - PostgreSQL publishes no port. It is reachable only on the internal network,
#     because a database on the public internet is the single worst mistake this
#     deployment could make (16-security-requirements.md).
#   - No MinIO. Storage is Cloudflare R2, addressed through the same STORAGE_* config
#     (07-upload-architecture.md), so no code branches on which is behind it.
#   - Images come from GHCR by tag rather than being built here. The tag is what a
#     rollback changes, and it is the only thing a rollback changes.
#   - Migrations are a one-off service the deploy runs and waits for, never a side
#     effect of an application container starting.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agencyhub}
    # Deliberately no `ports:`. Reachable only from the other services here.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-agencyhub}']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${API_IMAGE:?set API_IMAGE}
    restart: 'no'
    # Creates the least-privilege application role from the credentials already in
    # DATABASE_URL, then applies migrations as the owner. Both are idempotent.
    command: ['npm', 'run', 'db:setup', '--workspace=@agency-hub/api']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DB_OWNER_USER: ${DB_OWNER_USER:?set DB_OWNER_USER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${API_IMAGE:?set API_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DB_OWNER_USER: ${DB_OWNER_USER:?set DB_OWNER_USER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?set PASSWORD_PEPPER}
      SESSION_COOKIE_SECURE: 'true'
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?set STORAGE_ENDPOINT}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-${STORAGE_ENDPOINT}}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?set STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?set STORAGE_SECRET_ACCESS_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      BACKUP_DIRECTORY: /var/agency-hub/backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    volumes:
      - backups:/var/agency-hub/backups
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ${API_IMAGE:?set API_IMAGE}
    restart: unless-stopped
    command: ['node', 'apps/api/dist/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DB_OWNER_USER: ${DB_OWNER_USER:?set DB_OWNER_USER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?set PASSWORD_PEPPER}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?set STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?set STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?set STORAGE_SECRET_ACCESS_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      BACKUP_DIRECTORY: /var/agency-hub/backups
      BACKUP_RETENTION_MINUTES: ${BACKUP_RETENTION_MINUTES:-120}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    volumes:
      - backups:/var/agency-hub/backups
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      STORAGE_PUBLIC_ORIGIN: ${STORAGE_PUBLIC_ORIGIN:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    name: agency_hub_postgres_data
  backups:
    name: agency_hub_backups
  caddy_data:
    name: agency_hub_caddy_data
  caddy_config:
    name: agency_hub_caddy_config
