# Local development stack. Production compose (with Postgres not exposed
# publicly, per docs/sdd/16-security-requirements.md) is finalized in Stage 15
# of docs/sdd/21-mvp-roadmap.md — this file is the Stage 0 dev/CI baseline.
#
# The `web` app is intentionally not containerized here: it runs via the
# Vite dev server on the host (`npm run dev --workspace=@agency-hub/web`)
# for fast HMR during development.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agencyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agencyhub}
      POSTGRES_DB: ${POSTGRES_DB:-agencyhub}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agencyhub} -d ${POSTGRES_DB:-agencyhub}']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for local development and tests only. Production points
  # STORAGE_* at Cloudflare R2 (docs/sdd/07-upload-architecture.md); the application
  # talks the same S3 API to both, so nothing in the code branches on which is behind it.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-agencyhub}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-agencyhub-dev-secret}
    ports:
      - '${STORAGE_PORT:-9000}:9000'
      - '${STORAGE_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 15

  # One-shot: creates the development and test buckets if they are missing.
  minio-buckets:
    # The mc image publishes no stable semantic tag; it is a one-shot bucket
    # creator for local development only, so `latest` is acceptable here.
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >-
        mc alias set local http://minio:9000
        "${STORAGE_ACCESS_KEY_ID:-agencyhub}" "${STORAGE_SECRET_ACCESS_KEY:-agencyhub-dev-secret}" &&
        mc mb --ignore-existing local/"${STORAGE_BUCKET:-agency-hub-dev}" &&
        mc mb --ignore-existing local/"${TEST_STORAGE_BUCKET:-agency-hub-test}" &&
        mc mb --ignore-existing local/"${E2E_STORAGE_BUCKET:-agency-hub-e2e}" &&
        mc anonymous set none local/"${STORAGE_BUCKET:-agency-hub-dev}"

  # One-shot: brings the database schema up to date before the API starts.
  # Production deploys run migrations from the pipeline instead
  # (docs/sdd/19-deployment-and-cicd.md#migrations).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      - sh
      - -c
      - >-
        node apps/api/scripts/provision-app-role.mjs &&
        node apps/api/scripts/prisma.mjs migrate deploy
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set (see .env.example)}
      DB_OWNER_USER: ${DB_OWNER_USER:-agencyhub}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-agencyhub}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set (see .env.example)}
      # Queueing a job goes through pg-boss, which connects as the owner (env.ts).
      DB_OWNER_USER: ${DB_OWNER_USER:-agencyhub}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-agencyhub}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER must be set (see .env.example)}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT_DOCKER:-http://minio:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_ENDPOINT:-http://localhost:9000}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-agencyhub}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-agencyhub-dev-secret}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-agency-hub-dev}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      BACKUP_DIRECTORY: /var/agency-hub/backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    # The worker writes the dump and the API streams it, so both mount the same volume.
    volumes:
      - backups:/var/agency-hub/backups
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-buckets:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ['node', 'apps/api/dist/worker.js']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set (see .env.example)}
      DB_OWNER_USER: ${DB_OWNER_USER:-agencyhub}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-agencyhub}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER must be set (see .env.example)}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT_DOCKER:-http://minio:9000}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-agencyhub}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-agencyhub-dev-secret}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-agency-hub-dev}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      BACKUP_DIRECTORY: /var/agency-hub/backups
      BACKUP_RETENTION_MINUTES: ${BACKUP_RETENTION_MINUTES:-120}
      BACKUP_CLEANUP_CRON: ${BACKUP_CLEANUP_CRON:-30 * * * *}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - backups:/var/agency-hub/backups
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-buckets:
        condition: service_completed_successfully

volumes:
  postgres_data:
    name: agency_hub_postgres_data
  minio_data:
    name: agency_hub_minio_data
  backups:
    # Deliberately a named volume: a dump of the whole database must survive a
    # container restart long enough to be downloaded, and must not sit in the repo.
