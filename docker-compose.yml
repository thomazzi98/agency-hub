# Local development stack. Production compose (with Postgres not exposed
# publicly, per docs/sdd/16-security-requirements.md) is finalized in Stage 15
# of docs/sdd/21-mvp-roadmap.md — this file is the Stage 0 dev/CI baseline.
#
# The `web` app is intentionally not containerized here: it runs via the
# Vite dev server on the host (`npm run dev --workspace=@agency-hub/web`)
# for fast HMR during development.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agencyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agencyhub}
      POSTGRES_DB: ${POSTGRES_DB:-agencyhub}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agencyhub} -d ${POSTGRES_DB:-agencyhub}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://agencyhub:agencyhub@postgres:5432/agencyhub}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: agency_hub_postgres_data
